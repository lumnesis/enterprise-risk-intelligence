name: Phase 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: eri_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: eri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eri_test -d eri_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://eri_test:isolated-test-only@localhost:5432/eri_test
      DATABASE_URL: postgresql+psycopg://eri_test:isolated-test-only@localhost:5432/eri_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: docker compose --env-file .env.example config --quiet
